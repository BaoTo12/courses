<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow · Vanilla JS</title>
</head>
<body>
  <div class="page">
    <header class="page__header">
      <span class="page__brand">TaskFlow</span>
      <span class="text-muted">Vanilla JS: the "before React" version</span>
    </header>
    <main class="page__main">
      <h1 class="page__title">Tasks <span id="count" class="text-muted"></span></h1>
      <div id="filters" class="form__actions" style="margin-bottom: 16px">
        <button class="btn btn--secondary btn--sm" data-status="">All</button>
        <button class="btn btn--secondary btn--sm" data-status="TODO">To do</button>
        <button class="btn btn--secondary btn--sm" data-status="IN_PROGRESS">In progress</button>
        <button class="btn btn--secondary btn--sm" data-status="DONE">Done</button>
      </div>
      <p id="message" class="text-muted"></p>
      <div id="task-list" class="task-grid"></div>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
